name: concurrent-transactions-app

services:
  postgres:
    image: postgres:18-alpine
    container_name: concurrent-transactions-postgres
    environment:
      POSTGRES_DB: concurrent_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concurrent_transactions"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/concurrent_transactions
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
